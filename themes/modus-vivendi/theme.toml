# Palette: Protesilaos Stavrou's Modus Vivendi, pinned in SOURCES.md.
version = 1
id = "modus-vivendi"
name = "Modus Vivendi"
description = "Pure black, luminous type, and cool blue focus. Four nocturnes for reflection, in tribute to Protesilaos Stavrou."
author = "natex; palette by Protesilaos Stavrou"
tags = ["dark", "modus", "high-contrast", "monochrome", "blue", "contemplative"]

[palette]
background = "#000000"
surface = "#1e1e1e"
foreground = "#ffffff"
muted = "#989898"
accent = "#79a8ff"
secondary = "#b6a0ff"
ansi = [
  "#000000", "#ff5f59", "#44bc44", "#d0bc00",
  "#2fafff", "#feacd0", "#00d3d0", "#a6a6a6",
  "#595959", "#ff6b55", "#00c06f", "#fec43f",
  "#79a8ff", "#b6a0ff", "#6ae4b9", "#ffffff"
]

[files]
ghostty = "apps/ghostty.conf"
foot = "apps/foot.ini"
alacritty = "apps/alacritty.toml"
kitty = "apps/kitty.conf"
hyprlock = "apps/hyprlock.conf"
regreet = "apps/regreet.css"

[[wallpapers]]
name = "Moonlit grove"
path = "wallpapers/01-moonlit-grove.png"

[[wallpapers]]
name = "Celestial reason"
path = "wallpapers/02-celestial-reason.png"

[[wallpapers]]
name = "Ink archipelago"
path = "wallpapers/03-ink-archipelago.png"

[[wallpapers]]
name = "The unwritten study"
path = "wallpapers/04-unwritten-study.png"
